name: Askir static checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tools/verify_v77.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Askir-V77-offline-verification
          path: Reports/V77_verification.json
