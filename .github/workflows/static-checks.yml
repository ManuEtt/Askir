name: Askir static checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python Tools/verify_v84.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Askir-V84-offline-verification
          path: Reports/V84_verification.json
